name: Build STOP PALUDISME Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rgbdhanxswglgflbkazs.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnYmRoYW54c3dnbGdmbGJrYXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDIxMTEsImV4cCI6MjEwMjIxODExMX0.TQyiGaz2dQM0uMWeDeQw1_om2iu9U0qUiYAQ1DHqla0' }}

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize and Sync Capacitor Android
        run: |
          # Installer les dépendances Capacitor si nécessaire
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          
          # Vérifier la présence du dossier android, sinon l'initialiser
          if [ ! -d "android" ]; then
            npx cap init "STOP PALUDISME" "cd.stoppaludisme.app" --web-dir "dist"
            npx cap add android
          fi
          
          # Synchroniser le bundle Web compilé vers le projet Android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STOP-PALUDISME-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
