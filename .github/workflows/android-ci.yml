name: Build Android APK

on:
  push:
    branches: [ main ] 

jobs:
  build:
    name: Build and Package APK
    runs-on: ubuntu-latest
    
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      # --- CORRECTION : Utilisation de npm ci pour une installation propre et fiable ---
      - name: Install dependencies (Clean CI)
        run: |
          rm -rf node_modules
          npm ci

      - name: Build frontend (Vite)
        run: npm run build 

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' 

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ATTENTION : Assurez-vous que cette commande correspond à votre projet (ex: Capacitor)
      - name: Copy web assets to Android
        run: npx cap copy 

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug

      # C'EST L'ÉTAPE CRUCIALE POUR LE TÉLÉCHARGEMENT
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          # Vérifiez bien que le chemin de l'APK est correct pour votre projet
          # C'est le chemin standard pour un build debug avec Capacitor/Android
          path: android/app/build/outputs/apk/debug/app-debug.apk