name: Build Android APK

on:
  push:
    branches: [ main ] 

jobs:
  build:
    name: Build and Package APK
    runs-on: ubuntu-latest
    
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      # --- SOLUTION NUCLÉAIRE : Contournement du problème de binaire natif de Tailwind ---
      - name: Fix Tailwind native binding issue
        run: |
          npm install -g tailwindcss@latest
          npm uninstall tailwindcss # On le retire temporairement des devDependencies pour l'install classique

      - name: Install dependencies (Clean CI)
        run: |
          rm -rf node_modules package-lock.json
          npm ci
          npm install tailwindcss@latest --save-dev # On le réinstalle proprement

      - name: Build frontend (Vite)
        run: npm run build 

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' 

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy web assets to Android
        run: npx cap copy 

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk